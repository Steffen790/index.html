<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Tube – Kommentieren</title>
<style>
  :root { --bg: #f6f6f8; --card: #fff; --text: #16161a; --muted: #62626e; --accent: #e62129; --line: #dcdce2; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f0f12; --card: #1c1c22; --text: #f1f1f1; --muted: #a3a3ad; --line: #33333d; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 16px; } h1 span { color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
  .label { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .quote { white-space: pre-wrap; word-wrap: break-word; }
  textarea { width: 100%; min-height: 140px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; resize: vertical; }
  button { width: 100%; margin-top: 12px; padding: 14px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: 600 16px system-ui, sans-serif; }
  button:disabled { opacity: .5; }
  #msg { margin-top: 16px; } .ok { color: #1a8f3c; } .err { color: var(--accent); }
</style>
</head><body>
<main>
  <h1><span>▶</span> TV Tube – <span id="mode">Kommentieren</span></h1>
  <div id="target" class="card"><div class="label">Wird geladen …</div></div>
  <button id="login">Mit Google anmelden</button>
  <form id="form" hidden>
    <textarea id="text" maxlength="10000" placeholder="Dein Kommentar …" required></textarea>
    <button id="send" type="submit">Senden</button>
  </form>
  <p id="msg"></p>
</main>
<script>
// OAuth-Client-ID (Typ „Webanwendung“) aus der Google Cloud Console
var CLIENT_ID = '122896578389-am7a34qumghsq9qbv7kb6d5i22dhpbg3.apps.googleusercontent.com';
var SCOPE = 'https://www.googleapis.com/auth/youtube.force-ssl';
var API = 'https://www.googleapis.com/youtube/v3/';

var params = new URLSearchParams(location.search);
var videoId = params.get('v'), parentId = params.get('parent');
var token = null, client = null;
var $ = function (id) { return document.getElementById(id); };

function msg(text, cls) { $('msg').textContent = text; $('msg').className = cls || ''; }

function api(method, path, body) {
  return fetch(API + path, {
    method: method,
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  }).then(function (r) {
    return r.json().then(function (d) {
      if (!r.ok) {
        var e = d.error || {}, reason = e.errors && e.errors[0] ? e.errors[0].reason : '';
        var known = {
          commentsDisabled: 'Kommentare sind für dieses Video deaktiviert.',
          youtubeSignupRequired: 'Dein Google-Konto hat noch keinen YouTube-Kanal. Leg ihn einmal in der YouTube-App an.',
          insufficientPermissions: 'Fehlende Berechtigung – bitte neu anmelden und YouTube-Zugriff erlauben.',
          quotaExceeded: 'Tageskontingent der YouTube-API aufgebraucht.'
        };
        throw new Error(known[reason] || e.message || ('HTTP ' + r.status));
      }
      return d;
    });
  });
}

function showTarget() {
  var req = parentId
    ? api('GET', 'comments?part=snippet&textFormat=plainText&id=' + encodeURIComponent(parentId)).then(function (d) {
        var s = d.items[0].snippet;
        return { label: 'Antwort auf ' + s.authorDisplayName, text: s.textOriginal };
      })
    : api('GET', 'videos?part=snippet&id=' + encodeURIComponent(videoId)).then(function (d) {
        var s = d.items[0].snippet;
        return { label: 'Kommentar zu „' + s.channelTitle + '“', text: s.title };
      });
  return req.then(function (t) {
    $('target').innerHTML = '<div class="label"></div><div class="quote"></div>';
    $('target').querySelector('.label').textContent = t.label;
    $('target').querySelector('.quote').textContent = t.text;
  });
}

function onToken(resp) {
  if (resp.error) { msg('Anmeldung abgebrochen.', 'err'); return; }
  token = resp.access_token;
  $('login').hidden = true;
  $('form').hidden = false;
  $('text').focus();
  showTarget().catch(function (e) { msg(e.message, 'err'); });
}

$('login').onclick = function () {
  if (!CLIENT_ID) { msg('Keine Client-ID eingetragen.', 'err'); return; }
  if (!window.google || !google.accounts) { msg('Google-Anmeldung lädt noch – bitte gleich nochmal tippen.', 'err'); return; }
  if (!client) client = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPE, callback: onToken });
  client.requestAccessToken();
};

$('form').onsubmit = function (e) {
  e.preventDefault();
  var text = $('text').value.trim();
  if (!text) return;
  $('send').disabled = true;
  msg('Wird gesendet …');
  var req = parentId
    ? api('POST', 'comments?part=snippet', { snippet: { parentId: parentId, textOriginal: text } })
    : api('POST', 'commentThreads?part=snippet', { snippet: { videoId: videoId, topLevelComment: { snippet: { textOriginal: text } } } });
  req.then(function () {
    $('text').value = '';
    msg('Gesendet! Am Fernseher den QR-Code schließen – die Kommentare werden neu geladen.', 'ok');
  }, function (err) { msg(err.message, 'err'); })
    .then(function () { $('send').disabled = false; });
};

$('mode').textContent = parentId ? 'Antworten' : 'Kommentieren';
if (!videoId) { msg('Kein Video angegeben – bitte den QR-Code am Fernseher erneut scannen.', 'err'); $('login').disabled = true; }
else $('target').innerHTML = '<div class="label">Nach der Anmeldung siehst du hier, worauf du antwortest.</div>';
</script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</body></html>
